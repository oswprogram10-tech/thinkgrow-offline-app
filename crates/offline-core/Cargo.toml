[package]
name = "thinkgrow-offline-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "=0.10.3"
rand = "0.8"
ed25519-dalek = "=2.2.0"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
minisign-verify = "=0.2.4"
semver = "1"
url = "2"

argon2 = { version = "=0.5.3", features = ["zeroize"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "json"] }

[dev-dependencies]
tempfile = "3"
