[package]
name = "student"
version = "0.1.0"
description = "생각쑥쑥 학생"
authors = ["ThinkGrow"]
edition = "2021"

[lib]
name = "thinkgrow_offline_student_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
thinkgrow-offline-core = { path = "../../../crates/offline-core" }
tauri = { version = "2", features = [] }

tauri-plugin-opener = "2"

tauri-plugin-thinkgrow-vault = { path = "../../../crates/native-vault" }

serde_json = "1"
